---
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: spark-argo-application
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/zablon-oigo/argocd-spark-s3-kubernetes.git
    targetRevision: HEAD
    path: .

  destination:
    server: https://kubernetes.default.svc
    namespace: spark-apps

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
